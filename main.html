<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
        }
        /* Header row color */
        thead th {
            background-color: #a84343;
            color: white;
        }
        /* Entire Waist row color */
        tbody tr:nth-child(1) td {
            background-color: #e8c8c8;
        }
        /* Entire Chest row color */
        tbody tr:nth-child(2) td {
            background-color: #f2e2e2;
        }
        /* Entire Sleeve row color */
        tbody tr:nth-child(3) td {
            background-color: #d3d3d3;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Part</th>
                <th>XS</th>
                <th>S</th>
                <th>M</th>
                <th>L</th>
                <th>XL</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Waist</td>
                <td>25</td>
                <td>28</td>
                <td>30</td>
                <td>31</td>
                <td>32</td>
            </tr>
            <tr>
                <td>Chest</td>
                <td>34</td>
                <td>34</td>
                <td>38</td>
                <td>40</td>
                <td>41</td>
            </tr>
            <tr>
                <td>Sleeve</td>
                <td>23</td>
                <td>24</td>
                <td>24</td>
                <td>25</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
