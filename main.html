
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 14px;
        }

        thead th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>

<body>

    <h2>Size Chart</h2>

    <table>
        <thead>
            <tr>
                <th>Size</th>
                <th>Chest</th>
                <th>Waist</th>
                <th>Hip</th>
                <th>Shoulder</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>XS</td>
                <td>34</td>
                <td>28</td>
                <td>34</td>
                <td>15</td>
            </tr>

            <tr>
                <td>S</td>
                <td>36</td>
                <td>30</td>
                <td>36</td>
                <td>16</td>
            </tr>

            <tr>
                <td>M</td>
                <td>38</td>
                <td>32</td>
                <td>38</td>
                <td>17</td>
            </tr>

            <tr>
                <td>L</td>
                <td>40</td>
                <td>34</td>
                <td>40</td>
                <td>18</td>
            </tr>

            <tr>
                <td>XL</td>
                <td>42</td>
                <td>36</td>
                <td>42</td>
                <td>19</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
